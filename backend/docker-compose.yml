services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: my_sklad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_sklad"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/my_sklad
      CORS_ORIGINS: http://localhost,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ../frontend
    depends_on: [api]
    ports: ["80:80"]
volumes:
  postgres_data:
